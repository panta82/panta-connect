Name: Panta Connect
Summary: Paste desktop screenshots on Android with KDE Connect
Description: |-
  An independent KDE Connect Android fork with image clipboard reception.

  Copy a screenshot on a paired desktop, then insert it into a supported Android
  app using the keyboard's image clipboard suggestion. Stock KDE Connect Desktop
  works without modifications. Text clipboard sync and Share image remain available.

  Image transfers and temporary cache usage are bounded. Android-to-desktop
  automatic clipboard sharing is subject to Android's background restrictions.

  Based on KDE Connect and Jakob Müller Galvez's image clipboard implementation.
  This is not an official KDE release. Corresponding fork source accompanies
  each APK as a source archive.
